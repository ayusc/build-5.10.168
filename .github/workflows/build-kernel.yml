name: Build Xiaomi Redmi Gold 

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-gold:
    runs-on: ubuntu-22.04
    steps:
    
      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev dwarves \
            llvm lld clang gcc-aarch64-linux-gnu zstd zip unzip curl git

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 --branch gold-s-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          
      - name: Configure Kernel
        run: |
          cd kernel
          mkdir -p out
          make ARCH=arm64 O=out LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- gold_defconfig

          # Enable debug and BTF flags 
          ./scripts/config --file out/.config --enable CONFIG_DEBUG_INFO
          ./scripts/config --file out/.config --enable CONFIG_DEBUG_INFO_DWARF4
          ./scripts/config --file out/.config --disable CONFIG_DEBUG_INFO_DWARF5
          ./scripts/config --file out/.config --enable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --file out/.config --disable CONFIG_CRYPTO_ECDSA

          make ARCH=arm64 O=out LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build Kernel
        run: |
          cd kernel
          make -j$(nproc) ARCH=arm64 O=out \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            vmlinux

      - name: Zip vmlinux Only
        run: |
          mkdir -p dist
          cd kernel/out
          if [ ! -f "vmlinux" ]; then
            echo "Error: vmlinux was not generated!"
            exit 1
          fi
          zip -9 "$GITHUB_WORKSPACE/dist/vmlinux.zip" vmlinux

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-gold-vmlinux
          path: dist/vmlinux.zip
          retention-days: 7
