name: Build Android 12 ACK 5.10 with BTF & AnyKernel3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            llvm \
            lld \
            clang \
            gcc-aarch64-linux-gnu \
            zstd \
            zip \
            unzip \
            curl \
            git

      - name: Clone ACK Common Kernel Tree
        run: |
          git clone --depth=1 --branch android12-5.10.168_r00 \
            https://android.googlesource.com/kernel/common.git kernel

      - name: Configure Kernel & Enable BTF
        run: |
          cd kernel
          mkdir -p out
          
          # Generate base GKI configuration
          make ARCH=arm64 O=out gki_defconfig

          # Configure debug symbols and BTF generation
          ./scripts/config --file out/.config --enable CONFIG_DEBUG_INFO
          ./scripts/config --file out/.config --enable CONFIG_DEBUG_INFO_DWARF4
          ./scripts/config --file out/.config --disable CONFIG_DEBUG_INFO_DWARF5
          ./scripts/config --file out/.config --disable CONFIG_DEBUG_INFO_REDUCED
          ./scripts/config --file out/.config --disable CONFIG_DEBUG_INFO_COMPRESSED
          ./scripts/config --file out/.config --enable CONFIG_DEBUG_INFO_BTF

          # Sync config options
          make ARCH=arm64 O=out olddefconfig

          # Sanity check BTF setting
          grep "CONFIG_DEBUG_INFO_BTF=y" out/.config || {
            echo "Error: CONFIG_DEBUG_INFO_BTF is not enabled."
            exit 1
          }

      - name: Compile Kernel
        run: |
          cd kernel
          make -j$(nproc) ARCH=arm64 O=out \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            Image vmlinux

      - name: Extract BTF & Prepare Raw Image
        run: |
          cd kernel/out

          # Verify BTF exists in compiled vmlinux
          llvm-readelf -S vmlinux | grep -w "\.BTF" || {
            echo "Error: .BTF section missing from vmlinux!"
            exit 1
          }

          # Dump standalone raw BTF
          llvm-objcopy --dump-section .BTF=vmlinux.btf vmlinux

          mkdir -p ../../dist

          # 1. Standalone BTF
          cp vmlinux.btf ../../dist/

          # 2. Raw uncompressed kernel image for magiskboot repack
          cp arch/arm64/boot/Image ../../dist/Image

          # 3. Compressed unstripped vmlinux ELF
          tar -czvf ../../dist/vmlinux.tar.gz vmlinux

      - name: Package AnyKernel3 Zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/README.md

          # Place raw Image into AnyKernel3 root
          cp dist/Image ak3/Image

          # Generate AnyKernel3 configuration for GKI 2.0 (boot partition)
          cat << 'EOF' > ak3/anykernel.sh
### AnyKernel3 Ramdisk Mod Script
## osm0sis @ xda-developers

### AnyKernel setup
# global properties
properties() { '
kernel.string=Android 12 ACK 5.10.168 GKI
do.devicecheck=0
do.modules=0
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
'; } # end properties

### AnyKernel install
# boot shell variables
block=boot;
is_slot_device=auto;
ramdisk_compression=auto;
patch_vbmeta_flag=auto;

# import functions/variables and setup patching
. tools/ak3-core.sh;

# boot install
dump_boot;
write_boot;
## end boot install
EOF

          # Create flashable AnyKernel3 zip
          cd ak3
          zip -r9 ../dist/AnyKernel3-android12-5.10.168.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ACK-5.10.168-Artifacts
          path: dist/*
          retention-days: 7
